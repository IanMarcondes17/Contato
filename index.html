<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links Profissionais | Dev Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Botão para alternar tema -->
        <button id="theme-toggle" class="btn-theme">🌙 Modo Claro</button>

        <img src="imagen.jpg" alt="Foto de Perfil" class="profile-img">
        
        <h1>Seu Nome</h1>
        <p>Desenvolvedor Web & Soluções Digitais</p>

        <a href="https://wa.me/5512996855884?text=Ol%C3%A1,%20gostaria%20de%20um%20or%C3%A7amento!" target="_blank" class="btn-link btn-whatsapp">
            📱 Conversar no WhatsApp
        </a>

        <!-- Formulário de Captação de Clientes -->
        <div class="form-container">
            <h2>Solicitar Orçamento</h2>
            <form id="contact-form">
                <input type="text" id="cliente-nome" placeholder="Seu Nome ou Empresa" required>
                <input type="tel" id="cliente-whatsapp" placeholder="Seu WhatsApp (com DDD)" required>
                <select id="cliente-servico" required>
                    <option value="">Selecione o serviço...</option>
                    <option value="Cartão de Links / Bio">Cartão de Links / Bio</option>
                    <option value="Landing Page Completa">Landing Page Completa</option>
                    <option value="Organização de Planilhas">Organização de Planilhas</option>
                </select>
                <button type="submit" class="btn-submit">
                    <span>Enviar Solicitação</span>
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
